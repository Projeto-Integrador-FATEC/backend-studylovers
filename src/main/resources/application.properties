spring.application.name=Backend
server.port=4080

# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/studyloversDB?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA e Banco de Dados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# CORREÇÃO 1: Impede que o data.sql rode novamente e cause o erro de duplicação
spring.sql.init.mode=always

# CORREÇÃO 2: Garante que palavras com acento (ex: Programação) sejam salvas corretamente
spring.sql.init.encoding=UTF-8

# Upload de Arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB