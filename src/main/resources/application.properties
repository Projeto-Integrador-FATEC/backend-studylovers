spring.application.name=studylovers-recommender
server.port=4080
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Chave interna de autenticação entre serviços (Next.js -> Java)
studylovers.internal.api-key=${INTERNAL_API_KEY:studylovers-internal-secret-key}

# Modelo padrão para o recomendador
studylovers.ai.model=${STUDYLOVERS_AI_MODEL:gemini-3.5-flash-lite}
